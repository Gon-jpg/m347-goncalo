#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, docker
    home: /home/ubuntu
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa  teacher
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBlRt5qcV1PgtYeRuug+oeSDhnusinuQdRM2KEJsVzjh goncalo.dealmeida@edu.tbz.ch

ssh_pwauth: false
disable_root: false

package_update: true
package_upgrade: true

groups:
  - docker

system_info:
  default_user:
    groups: [docker]

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - unattended-upgrades

write_files:
  - path: /home/ubuntu/web/Dockerfile
    content: |
      FROM php:8.0-apache
      WORKDIR /var/www/html
      COPY info.php .
      COPY db.php .
      RUN docker-php-ext-install mysqli
      EXPOSE 80

  - path: /home/ubuntu/web/info.php
    content: |
      <?php
      phpinfo();
      ?>

  - path: /home/ubuntu/web/db.php
    content: |
      <?php
      $servername = "m347-kn04a-db";
      $username = "root";
      $password = "rootpassword";
      $dbname = "mysql";

      $conn = new mysqli($servername, $username, $password, $dbname);

      if ($conn->connect_error) {
          die("Connection failed: " . $conn->connect_error);
      }

      echo "<h1>Datenbankverbindung erfolgreich!</h1>";
      echo "<p>Verbunden mit Datenbank auf: " . $servername . "</p>";

      $sql = "SELECT User, Host FROM mysql.user";
      $result = $conn->query($sql);

      if ($result->num_rows > 0) {
          echo "<table border='1'><tr><th>User</th><th>Host</th></tr>";
          while($row = $result->fetch_assoc()) {
              echo "<tr><td>" . $row["User"] . "</td><td>" . $row["Host"] . "</td></tr>";
          }
          echo "</table>";
      }
      $conn->close();
      ?>

  - path: /home/ubuntu/docker-compose.yml
    content: |
      services:
        m347-kn04a-web:
          container_name: m347-kn04a-web
          build: ./web
          ports:
            - "80:80"
          networks:
            - kn04-net
          depends_on:
            - m347-kn04a-db

        m347-kn04a-db:
          container_name: m347-kn04a-db
          image: mariadb:latest
          environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: mysql
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
          networks:
            - kn04-net

      networks:
        kn04-net:
          driver: bridge
          ipam:
            config:
              - subnet: 172.20.0.0/16
                ip_range: 172.20.5.0/24
                gateway: 172.20.5.254

runcmd:
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - chown -R ubuntu:ubuntu /home/ubuntu/web
  - chown ubuntu:ubuntu /home/ubuntu/docker-compose.yml
  - cd /home/ubuntu && docker compose up -d --build

final_message: "KN04 Teil B Cloud is up and running after $UPTIME seconds"
